name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: every main Gloomhaven scenario played to the end.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, golden and playthrough tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  all-scenarios:
    name: Every scenario played to the end
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build --build-tests

      - name: Play every scenario (4 seeds each, half on Easy)
        env:
          SIM_ALL: '1'
          SIM_SEEDS: '4'
        run: swift test --skip-build --filter PlaythroughTests/testAllScenariosPlayToALegitimateEnd
